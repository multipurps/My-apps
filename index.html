<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="MyApps"/>
<meta name="theme-color" content="#0d0d14"/>
<title>MyApps</title>

<!-- Manifest injected via JS below -->

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap"/>

<style>
  :root {
    --bg: #0d0d14;
    --surface: #16161f;
    --surface2: #1e1e2a;
    --border: rgba(255,255,255,0.07);
    --text: #f0f0f5;
    --muted: #7b7b92;
    --accent: #7c6cff;
    --accent2: #ff6c8a;
    --radius: 18px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    padding-top: calc(var(--safe-top) + 0px);
    padding-bottom: calc(var(--safe-bottom) + 60px);
    min-height: 100dvh;
  }

  /* Background texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 0%, rgba(124,108,255,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 100%, rgba(255,108,138,0.08) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .shell {
    position: relative;
    z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    padding: 0 16px;
  }

  /* Header */
  .header {
    padding: 20px 0 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .header-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #fff 0%, #9b8fff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .header-sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }

  .install-btn {
    background: rgba(124,108,255,0.15);
    border: 1px solid rgba(124,108,255,0.3);
    color: #9b8fff;
    border-radius: 20px;
    padding: 8px 14px;
    font-size: 12px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    cursor: pointer;
    display: none;
    transition: background 0.2s;
  }
  .install-btn.visible { display: block; }
  .install-btn:active { background: rgba(124,108,255,0.28); }

  /* Search */
  .search-wrap {
    position: relative;
    margin: 14px 0 20px;
  }

  .search-wrap svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    opacity: 0.4;
    pointer-events: none;
  }

  .search {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 16px 12px 42px;
    color: var(--text);
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    outline: none;
    transition: border-color 0.2s;
  }
  .search:focus { border-color: rgba(124,108,255,0.5); }
  .search::placeholder { color: var(--muted); }

  /* Category pills */
  .cats {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    margin-bottom: 20px;
    scrollbar-width: none;
  }
  .cats::-webkit-scrollbar { display: none; }

  .cat-pill {
    flex-shrink: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .cat-pill.active {
    background: rgba(124,108,255,0.18);
    border-color: rgba(124,108,255,0.4);
    color: #b0a4ff;
  }

  /* Section label */
  .section-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
    padding-left: 2px;
  }

  /* App grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 28px;
  }

  .app-tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    cursor: pointer;
    padding: 4px 2px;
    border-radius: 14px;
    transition: transform 0.12s, opacity 0.12s;
    text-decoration: none;
    color: inherit;
    -webkit-user-select: none;
    user-select: none;
  }
  .app-tile:active {
    transform: scale(0.91);
    opacity: 0.8;
  }
  .app-tile.hidden { display: none; }

  .app-icon {
    width: 62px;
    height: 62px;
    border-radius: 16px;
    background: var(--surface2);
    border: 1px solid var(--border);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    transition: box-shadow 0.15s;
  }
  .app-tile:active .app-icon {
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }

  .app-icon img {
    width: 38px;
    height: 38px;
    object-fit: contain;
    border-radius: 6px;
  }

  /* Fallback icon letter */
  .app-icon .fallback {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    display: none;
  }

  .app-name {
    font-size: 11px;
    font-weight: 500;
    color: var(--text);
    text-align: center;
    line-height: 1.2;
    max-width: 68px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Add app tile */
  .add-tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    cursor: pointer;
    padding: 4px 2px;
    border-radius: 14px;
  }

  .add-icon {
    width: 62px;
    height: 62px;
    border-radius: 16px;
    background: transparent;
    border: 1.5px dashed rgba(255,255,255,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.15s;
  }
  .add-tile:active .add-icon { border-color: rgba(124,108,255,0.5); }
  .add-icon svg { opacity: 0.35; }

  .add-name {
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
    text-align: center;
  }

  /* Add modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 100;
    display: flex;
    align-items: flex-end;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }
  .modal-overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  .modal {
    width: 100%;
    background: var(--surface);
    border-radius: 24px 24px 0 0;
    padding: 20px 20px calc(24px + var(--safe-bottom));
    transform: translateY(20px);
    transition: transform 0.25s;
  }
  .modal-overlay.open .modal { transform: translateY(0); }

  .modal-handle {
    width: 36px;
    height: 4px;
    background: rgba(255,255,255,0.12);
    border-radius: 2px;
    margin: 0 auto 20px;
  }

  .modal-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 16px;
  }

  .modal input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    outline: none;
    margin-bottom: 10px;
    transition: border-color 0.2s;
  }
  .modal input:focus { border-color: rgba(124,108,255,0.5); }
  .modal input::placeholder { color: var(--muted); }

  .modal-save {
    width: 100%;
    background: linear-gradient(135deg, #7c6cff, #9b6bff);
    border: none;
    border-radius: 14px;
    padding: 14px;
    color: #fff;
    font-size: 15px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    cursor: pointer;
    margin-top: 6px;
    transition: opacity 0.15s;
  }
  .modal-save:active { opacity: 0.8; }

  /* Bottom nav */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0; right: 0;
    background: rgba(13,13,20,0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    padding: 10px 0 calc(10px + var(--safe-bottom));
    display: flex;
    justify-content: space-around;
    z-index: 10;
  }

  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    padding: 4px 20px;
    opacity: 0.45;
    transition: opacity 0.15s;
    border: none;
    background: none;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
  }
  .nav-item.active { opacity: 1; }
  .nav-item span { font-size: 10px; font-weight: 500; }

  /* No results */
  .no-results {
    text-align: center;
    padding: 40px 0;
    color: var(--muted);
    font-size: 14px;
    display: none;
  }
  .no-results.visible { display: block; }
</style>
</head>
<body>

<div class="shell">
  <div class="header">
    <div>
      <div class="header-title">MyApps</div>
      <div class="header-sub">Your web launcher</div>
    </div>
    <button class="install-btn" id="installBtn">+ Install</button>
  </div>

  <div class="search-wrap">
    <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
    </svg>
    <input class="search" type="search" placeholder="Search apps..." id="searchInput"/>
  </div>

  <div class="cats" id="catBar">
    <div class="cat-pill active" data-cat="all">All</div>
    <div class="cat-pill" data-cat="ai">AI</div>
    <div class="cat-pill" data-cat="social">Social</div>
    <div class="cat-pill" data-cat="productivity">Work</div>
    <div class="cat-pill" data-cat="entertainment">Media</div>
    <div class="cat-pill" data-cat="search">Search</div>
    <div class="cat-pill" data-cat="dev">Dev</div>
  </div>

  <div class="section-label">Apps</div>

  <div class="grid" id="appGrid"></div>

  <div class="no-results" id="noResults">No apps found</div>
</div>

<!-- Bottom nav -->
<div class="bottom-nav">
  <button class="nav-item active">
    <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    <span>Home</span>
  </button>
  <button class="nav-item" id="recentBtn">
    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    <span>Recent</span>
  </button>
  <button class="nav-item" id="addNavBtn">
    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
    <span>Add</span>
  </button>
</div>

<!-- Add app modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Add App</div>
    <input type="text" id="newAppName" placeholder="App name (e.g. Notion)"/>
    <input type="url" id="newAppUrl" placeholder="URL (e.g. https://notion.so)"/>
    <button class="modal-save" id="saveAppBtn">Add to launcher</button>
  </div>
</div>

<script>
// ── App registry ──────────────────────────────────────────────────────────────
const APPS = [
  // AI
  { id:'chatgpt',    name:'ChatGPT',    url:'https://chatgpt.com',              cat:'ai',            color:'#10a37f' },
  { id:'claude',     name:'Claude',     url:'https://claude.ai',                cat:'ai',            color:'#cc9b7a' },
  { id:'gemini',     name:'Gemini',     url:'https://gemini.google.com',        cat:'ai',            color:'#4285f4' },
  { id:'kimi',       name:'Kimi',       url:'https://kimi.ai',                  cat:'ai',            color:'#222' },
  { id:'arena',      name:'AI Arena',   url:'https://lmarena.ai',               cat:'ai',            color:'#5b6cf9' },
  { id:'perplexity', name:'Perplexity', url:'https://perplexity.ai',            cat:'ai',            color:'#1fb8cd' },
  { id:'deepseek',   name:'DeepSeek',   url:'https://chat.deepseek.com',        cat:'ai',            color:'#0e6fff' },
  { id:'grok',       name:'Grok',       url:'https://grok.com',                 cat:'ai',            color:'#fff' },
  { id:'mistral',    name:'Mistral',    url:'https://chat.mistral.ai',          cat:'ai',            color:'#ff6b35' },
  { id:'copilot',    name:'Copilot',    url:'https://copilot.microsoft.com',    cat:'ai',            color:'#0078d4' },

  // Social
  { id:'facebook',   name:'Facebook',   url:'https://facebook.com',             cat:'social',        color:'#1877f2' },
  { id:'instagram',  name:'Instagram',  url:'https://instagram.com',            cat:'social',        color:'#e1306c' },
  { id:'x',          name:'X',          url:'https://x.com',                    cat:'social',        color:'#000' },
  { id:'whatsapp',   name:'WhatsApp',   url:'https://web.whatsapp.com',         cat:'social',        color:'#25d366' },
  { id:'telegram',   name:'Telegram',   url:'https://web.telegram.org',         cat:'social',        color:'#2ca5e0' },
  { id:'linkedin',   name:'LinkedIn',   url:'https://linkedin.com',             cat:'social',        color:'#0a66c2' },
  { id:'tiktok',     name:'TikTok',     url:'https://tiktok.com',               cat:'social',        color:'#010101' },
  { id:'reddit',     name:'Reddit',     url:'https://reddit.com',               cat:'social',        color:'#ff4500' },
  { id:'discord',    name:'Discord',    url:'https://discord.com/app',          cat:'social',        color:'#5865f2' },
  { id:'threads',    name:'Threads',    url:'https://threads.net',              cat:'social',        color:'#101010' },

  // Productivity / Work
  { id:'gmail',      name:'Gmail',      url:'https://mail.google.com',          cat:'productivity',  color:'#ea4335' },
  { id:'gdrive',     name:'Drive',      url:'https://drive.google.com',         cat:'productivity',  color:'#34a853' },
  { id:'gdocs',      name:'Docs',       url:'https://docs.google.com',          cat:'productivity',  color:'#4285f4' },
  { id:'notion',     name:'Notion',     url:'https://notion.so',                cat:'productivity',  color:'#191919' },
  { id:'sheets',     name:'Sheets',     url:'https://sheets.google.com',        cat:'productivity',  color:'#34a853' },
  { id:'calendar',   name:'Calendar',   url:'https://calendar.google.com',      cat:'productivity',  color:'#1a73e8' },
  { id:'trello',     name:'Trello',     url:'https://trello.com',               cat:'productivity',  color:'#0052cc' },
  { id:'slack',      name:'Slack',      url:'https://app.slack.com',            cat:'productivity',  color:'#4a154b' },

  // Entertainment
  { id:'youtube',    name:'YouTube',    url:'https://youtube.com',              cat:'entertainment', color:'#ff0000' },
  { id:'netflix',    name:'Netflix',    url:'https://netflix.com',              cat:'entertainment', color:'#e50914' },
  { id:'spotify',    name:'Spotify',    url:'https://open.spotify.com',         cat:'entertainment', color:'#1db954' },
  { id:'twitch',     name:'Twitch',     url:'https://twitch.tv',                cat:'entertainment', color:'#9146ff' },

  // Search
  { id:'google',     name:'Google',     url:'https://google.com',               cat:'search',        color:'#4285f4' },
  { id:'bing',       name:'Bing',       url:'https://bing.com',                 cat:'search',        color:'#008373' },
  { id:'brave',      name:'Brave',      url:'https://search.brave.com',         cat:'search',        color:'#fb542b' },

  // Dev
  { id:'github',     name:'GitHub',     url:'https://github.com',               cat:'dev',           color:'#24292f' },
  { id:'codepen',    name:'CodePen',    url:'https://codepen.io',               cat:'dev',           color:'#000' },
  { id:'replit',     name:'Replit',     url:'https://replit.com',               cat:'dev',           color:'#f26207' },
  { id:'vercel',     name:'Vercel',     url:'https://vercel.com',               cat:'dev',           color:'#000' },
  { id:'supabase',   name:'Supabase',   url:'https://supabase.com',             cat:'dev',           color:'#3ecf8e' },
];

// Load custom apps from localStorage
let customApps = [];
try { customApps = JSON.parse(localStorage.getItem('launcher_custom') || '[]'); } catch(e) {}

let allApps = [...APPS, ...customApps];
let activeCategory = 'all';
let searchQuery = '';

// ── Favicon helper ────────────────────────────────────────────────────────────
function faviconUrl(url) {
  const domain = new URL(url).hostname.replace('www.', '');
  return `https://logo.clearbit.com/${domain}`;
}

// ── Render grid ───────────────────────────────────────────────────────────────
function render() {
  const grid = document.getElementById('appGrid');
  const noResults = document.getElementById('noResults');

  let apps = allApps;

  if (activeCategory !== 'all') {
    apps = apps.filter(a => a.cat === activeCategory);
  }

  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    apps = apps.filter(a =>
      a.name.toLowerCase().includes(q) || a.url.toLowerCase().includes(q)
    );
  }

  grid.innerHTML = '';

  if (apps.length === 0) {
    noResults.classList.add('visible');
  } else {
    noResults.classList.remove('visible');
  }

  apps.forEach(app => {
    const tile = document.createElement('a');
    tile.className = 'app-tile';
    tile.href = app.url;
    tile.target = '_blank';
    tile.rel = 'noopener noreferrer';
    tile.setAttribute('data-id', app.id || app.name);

    // Long press to delete custom apps
    if (app.custom) {
      let pressTimer;
      tile.addEventListener('touchstart', () => {
        pressTimer = setTimeout(() => {
          if (confirm(`Remove ${app.name}?`)) {
            customApps = customApps.filter(a => a.name !== app.name);
            localStorage.setItem('launcher_custom', JSON.stringify(customApps));
            allApps = [...APPS, ...customApps];
            render();
          }
        }, 600);
      }, { passive: true });
      tile.addEventListener('touchend', () => clearTimeout(pressTimer));
      tile.addEventListener('touchmove', () => clearTimeout(pressTimer));
    }

    const iconDiv = document.createElement('div');
    iconDiv.className = 'app-icon';

    const img = document.createElement('img');
    img.src = faviconUrl(app.url);
    img.alt = app.name;
    img.onerror = function() {
      this.style.display = 'none';
      const fb = iconDiv.querySelector('.fallback');
      if (fb) fb.style.display = 'block';
    };

    // Colored background based on app brand color
    iconDiv.style.background = `linear-gradient(145deg, ${app.color}22, ${app.color}11)`;
    iconDiv.style.borderColor = `${app.color}25`;

    const fallback = document.createElement('span');
    fallback.className = 'fallback';
    fallback.textContent = app.name[0];

    iconDiv.appendChild(img);
    iconDiv.appendChild(fallback);

    const nameSpan = document.createElement('span');
    nameSpan.className = 'app-name';
    nameSpan.textContent = app.name;

    tile.appendChild(iconDiv);
    tile.appendChild(nameSpan);
    grid.appendChild(tile);
  });

  // Add tile at end
  const addTile = document.createElement('div');
  addTile.className = 'add-tile';
  addTile.innerHTML = `
    <div class="add-icon">
      <svg width="24" height="24" fill="none" stroke="white" stroke-width="2" viewBox="0 0 24 24">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </div>
    <span class="add-name">Add</span>
  `;
  addTile.addEventListener('click', openModal);
  grid.appendChild(addTile);
}

// ── Category filter ───────────────────────────────────────────────────────────
document.getElementById('catBar').addEventListener('click', e => {
  const pill = e.target.closest('.cat-pill');
  if (!pill) return;
  document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
  pill.classList.add('active');
  activeCategory = pill.dataset.cat;
  render();
});

// ── Search ────────────────────────────────────────────────────────────────────
document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  render();
});

// ── Add modal ─────────────────────────────────────────────────────────────────
function openModal() {
  document.getElementById('modalOverlay').classList.add('open');
  setTimeout(() => document.getElementById('newAppName').focus(), 300);
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.getElementById('newAppName').value = '';
  document.getElementById('newAppUrl').value = '';
}

document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
});

document.getElementById('addNavBtn').addEventListener('click', openModal);

document.getElementById('saveAppBtn').addEventListener('click', () => {
  const name = document.getElementById('newAppName').value.trim();
  let url = document.getElementById('newAppUrl').value.trim();

  if (!name || !url) return;
  if (!url.startsWith('http')) url = 'https://' + url;

  try { new URL(url); } catch(e) { alert('Invalid URL'); return; }

  const newApp = { id: Date.now().toString(), name, url, cat: 'productivity', color: '#7c6cff', custom: true };
  customApps.push(newApp);
  localStorage.setItem('launcher_custom', JSON.stringify(customApps));
  allApps = [...APPS, ...customApps];
  render();
  closeModal();
});

// ── PWA Install ───────────────────────────────────────────────────────────────
let deferredPrompt = null;

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBtn').classList.add('visible');
});

document.getElementById('installBtn').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  if (outcome === 'accepted') {
    document.getElementById('installBtn').classList.remove('visible');
  }
  deferredPrompt = null;
});

// ── Service Worker ────────────────────────────────────────────────────────────
const SW_CODE = `
const CACHE = 'launcher-v1';
const SHELL = ['/'];

self.addEventListener('install', e => {
  e.waitUntil(caches.open(CACHE).then(c => c.addAll(SHELL)).then(() => self.skipWaiting()));
});

self.addEventListener('activate', e => {
  e.waitUntil(
    caches.keys().then(keys =>
      Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))
    ).then(() => self.clients.claim())
  );
});

self.addEventListener('fetch', e => {
  if (e.request.mode === 'navigate') {
    e.respondWith(
      fetch(e.request).catch(() => caches.match('/'))
    );
  }
});
`;

if ('serviceWorker' in navigator) {
  const blob = new Blob([SW_CODE], { type: 'application/javascript' });
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl, { scope: '/' })
    .then(() => console.log('SW registered'))
    .catch(e => console.warn('SW failed:', e));
}
